name: Mobile upstream sync

# Regenerates bindings against the current main and opens a PR in this fork
# that advances mobile/upstream.lock. A failing check leaves the lock alone.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository != 'zeronsh/zeron'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Skip
        run: brew install skiptools/skip/skip
      - name: Regenerate and validate
        run: mobile/Codegen/sync.sh
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: mobile/upstream-sync
          commit-message: 'mobile: sync generated bindings with upstream'
          title: 'mobile: upstream sync'
          body: 'Regenerated by `mobile/Codegen/sync.sh`. Review handwritten counterparts listed in the job log.'
          add-paths: |
            mobile/Generated
            mobile/upstream.lock
